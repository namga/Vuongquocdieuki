name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Do not enable npm cache until package-lock.json is committed.

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor for iOS
        run: npx cap sync ios

      - name: Resolve iOS native dependencies
        run: |
          if [ -f ios/App/Podfile ]; then
            echo "Podfile detected; install Capacitor CocoaPods dependencies."
            pod install --project-directory=ios/App
            echo "IOS_BUILD_MODE=workspace" >> "$GITHUB_ENV"
          else
            echo "No Podfile detected; resolve Swift Package Manager dependencies."
            xcodebuild -resolvePackageDependencies \
              -project ios/App/App.xcodeproj \
              -scheme App
            echo "IOS_BUILD_MODE=project" >> "$GITHUB_ENV"
          fi

      - name: Build for iOS Simulator (unsigned)
        run: |
          if [ "$IOS_BUILD_MODE" = "workspace" ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
              build
          fi

      - name: Package simulator app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Vuong-Quoc-Dieu-Ki-iOS-Simulator-App.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vuong-Quoc-Dieu-Ki-iOS-Simulator-App
          path: Vuong-Quoc-Dieu-Ki-iOS-Simulator-App.zip
          if-no-files-found: error
          retention-days: 14
